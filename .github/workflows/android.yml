name: Build Tabahi Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Missing Gradle Files
      run: |
        echo "=== Preparing all Gradle and Android build files ==="
        
        # 1. Auto-create settings.gradle.kts if missing
        if [ ! -f "settings.gradle.kts" ]; then
          cat << 'EOF' > settings.gradle.kts
pluginManagement {
  repositories {
    google {
      content {
        includeGroupByRegex("com\\.android.*")
        includeGroupByRegex("com\\.google.*")
        includeGroupByRegex("androidx.*")
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "Tabahi"

include(":app")
EOF
          echo "Created settings.gradle.kts"
        fi

        # 2. Auto-create build.gradle.kts (root) if missing
        if [ ! -f "build.gradle.kts" ]; then
          cat << 'EOF' > build.gradle.kts
plugins {
  alias(libs.plugins.android.application) apply false
  alias(libs.plugins.kotlin.compose) apply false
  alias(libs.plugins.google.devtools.ksp) apply false
  alias(libs.plugins.secrets) apply false
  alias(libs.plugins.google.services) apply false
}
EOF
          echo "Created build.gradle.kts"
        fi

        # 3. Auto-create gradle.properties if missing
        if [ ! -f "gradle.properties" ]; then
          cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
googleServices.missing.passthrough=true
EOF
          echo "Created gradle.properties"
        fi

        # 4. Auto-create gradle-wrapper.properties if missing
        mkdir -p gradle/wrapper
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          echo "Created gradle-wrapper.properties"
        fi

        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar || true
        fi

        # 5. Create debug.keystore if missing for debugConfig
        if [ ! -f "debug.keystore" ]; then
          echo "Generating debug.keystore for signingConfig..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        fi

        # 6. Ensure .env exists
        if [ ! -f ".env" ]; then
          touch .env
        fi

        chmod +x gradlew || true
        echo "=== All build files prepared and verified ==="
        ls -la

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Tabahi-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
